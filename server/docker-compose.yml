services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -lc "npm run storage:ensure && npx prisma migrate deploy && npm run start"
    init: true
    env_file:
      - .env
    environment:
      APP_ROLE: app
      STORAGE_PATH: /data
      DATABASE_URL: file:/data/database/library.db
    ports:
      - "8787:8787"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ${APP_DATA_DIR:-./runtime}:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8787/readyz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 512m
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -lc "npm run storage:ensure && while [ ! -f /data/database/library.db ]; do sleep 1; done; npm run worker:start"
    init: true
    env_file:
      - .env
    environment:
      APP_ROLE: worker
      STORAGE_PATH: /data
      DATABASE_URL: file:/data/database/library.db
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ${APP_DATA_DIR:-./runtime}:/data
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 1024m
    restart: unless-stopped

  redis:
    image: redis:7-bookworm
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      options:
        max-size: "5m"
        max-file: "2"
    mem_limit: 256m
    restart: unless-stopped
